name: Tests

on:
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
        coverage: pcov

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    # A base legada ainda possui dívida de formatação registrada em QA-004.
    # Todo arquivo PHP novo continua sendo bloqueado se não cumprir o Pint.
    - name: Run Laravel Pint on new PHP files
      shell: bash
      run: |
        base='${{ github.event.pull_request.base.sha || github.event.before }}'
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          base="$(git rev-parse "$GITHUB_SHA^")"
        fi

        git diff --diff-filter=A --name-only -z "$base" "$GITHUB_SHA" -- '*.php' |
          xargs -0 -r vendor/bin/pint --test

    # A análise integral volta a ser obrigatória após saneamento da base legada
    # registrado em QA-002. Arquivos de aplicação adicionados neste PR são bloqueados já.
    - name: Run Larastan on new application files
      shell: bash
      run: |
        base='${{ github.event.pull_request.base.sha || github.event.before }}'
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          base="$(git rev-parse "$GITHUB_SHA^")"
        fi

        files="$(git diff --diff-filter=A --name-only "$base" "$GITHUB_SHA" -- 'app/**/*.php' 'app/*.php')"
        if [[ -n "$files" ]]; then
          vendor/bin/phpstan analyse --memory-limit=2G $files
        else
          echo "No new application PHP files to analyse."
        fi

    - name: Install frontend dependencies
      run: npm ci

    # A base legada possui erros de lint registrados em QA-008.
    # Todo arquivo frontend novo é validado integralmente neste ponto.
    - name: Run ESLint on new frontend files
      shell: bash
      run: |
        base='${{ github.event.pull_request.base.sha || github.event.before }}'
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          base="$(git rev-parse "$GITHUB_SHA^")"
        fi

        git diff --diff-filter=A --name-only -z "$base" "$GITHUB_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx' |
          xargs -0 -r npx eslint

    - name: Run Vitest
      run: npm run test:ui

    - name: Generate key
      run: php artisan key:generate

    - name: Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: Run Migrations
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Validate database preflight
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan database:preflight --json

    - name: Execute tests with coverage
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test --coverage-clover coverage.xml

    - name: Verify frontend imports
      run: npm run verify:imports

    - name: Build frontend
      run: npm run build
